name: iPadHotspotProbe
options:
  bundleIdPrefix: com.itgeorge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: TJY5296P7S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "2"
targets:
  iPadHotspotProbe:
    type: application
    platform: iOS
    sources:
      - iPadHotspotProbe
    info:
      path: Info.plist
      properties:
        NSLocalNetworkUsageDescription: "This temporary probe checks direct iPad-to-Mac HTTP and Bonjour communication on the iPhone hotspot."
        NSBonjourServices:
          - _hotspotprobe._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.itgeorge.iPadHotspotProbe
      PRODUCT_NAME: iPadHotspotProbe
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: TJY5296P7S
      CODE_SIGN_STYLE: Automatic
